  This must be a real about/index.html for GitHub Pages to serve it at that
  address, and `build.format: 'file'` flattens src/pages/about/index.astro
  into about.html, so it is a static file in public/ instead of a route.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="canonical" href="https://betimdrenica.com/bio.html" />
    <meta http-equiv="refresh" content="0; url=https://betimdrenica.com/bio.html" />
    <title>Moved — https://betimdrenica.com/bio.html</title>
  </head>
  <body>
    <p>This page has moved to <a href="https://betimdrenica.com/bio.html">https://betimdrenica.com/bio.html</a>.</p>
    <script>
      window.location.replace('https://betimdrenica.com/bio.html')
    </script>
  </body>
</html>
